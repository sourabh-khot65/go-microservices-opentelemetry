server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(order-service|notification-service)
        target_label: __tmp_container_name
      - source_labels: [__meta_docker_container_name]
        regex: /(order-service|notification-service)
        target_label: service_name
      - source_labels: [__meta_docker_container_name]
        regex: /(order-service|notification-service)
        target_label: job
      - source_labels: [__meta_docker_container_id]
        target_label: container_id
      - replacement: /var/lib/docker/containers/*/*.log
        target_label: __path__
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
      - json:
          source: output
          expressions:
            level: level
            message: msg
            trace_id: trace_id
            span_id: span_id
            request_id: request_id
            service: service
            order_id: order_id
            product_id: product_id
            notification_id: notification_id
            error: error
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level: level
          service: service
      - match:
          selector: '{trace_id!=""}'
          stages:
            - labels:
                trace_id: trace_id
                span_id: span_id
      - output:
          source: message
