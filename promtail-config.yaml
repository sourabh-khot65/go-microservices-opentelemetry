server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: order-service-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: order-service
          __path__: /var/log/order-service/*.log
  - job_name: notification-service-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: notification-service
          __path__: /var/log/notification-service/*.log
