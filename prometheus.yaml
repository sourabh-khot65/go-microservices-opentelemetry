global:
  scrape_interval: 15s

scrape_configs:
  # Only scrape metrics from OpenTelemetry Collector
  # Services push their metrics via OTLP to the collector
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
    scrape_interval: 15s
    metrics_path: /metrics
